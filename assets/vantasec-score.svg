<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1000" height="430" rx="20" fill="#070b12"/>
<rect x="1" y="1" width="998" height="428" rx="19" fill="none" stroke="#1b2838"/>
<g transform="translate(40,40)">
<circle r="15" fill="none" stroke="#3a8fa3" stroke-width="1.4"/>
<circle r="8" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
<circle r="2.2" fill="#22d3ee"/>
<line x1="0" y1="0" x2="10.5" y2="-10.5" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
</g>
<text x="66" y="46" fill="#e8eef6" font-size="24" font-weight="700">vanta<tspan fill="#22d3ee">sec</tspan></text>
<text x="960" y="34" text-anchor="end" fill="#8595a8" font-size="12" letter-spacing="3" font-weight="600">SCORE, GATE &amp; AUTOMATE</text>
<text x="960" y="52" text-anchor="end" fill="#8595a8" font-size="11.5">one graded result &#8212; on screen, in CI, or to an agent</text>
<line x1="40" y1="70" x2="960" y2="70" stroke="#1b2838"/>

<!-- card 1 : score -->
<rect x="40" y="96" width="296" height="300" rx="13" fill="#0e1622" stroke="#1b2838"/>
<rect x="40" y="96" width="296" height="5" rx="2.5" fill="#22d3ee"/>
<text x="60" y="128" fill="#22d3ee" font-size="12.5" font-weight="700" letter-spacing="1.5">SECURITY SCORE</text>
<circle cx="188" cy="216" r="58" fill="none" stroke="#1b2838" stroke-width="10"/>
<path d="M188,158 A58,58 0 1,1 137,245" fill="none" stroke="#5bbf93" stroke-width="10" stroke-linecap="round"/>
<text x="188" y="214" text-anchor="middle" fill="#5bbf93" font-size="46" font-weight="700">A</text>
<text x="188" y="238" text-anchor="middle" fill="#8595a8" font-size="13">92 / 100</text>
<text x="188" y="300" text-anchor="middle" fill="#e8eef6" font-size="12.5">Overall posture across every check,</text>
<text x="188" y="318" text-anchor="middle" fill="#e8eef6" font-size="12.5">rolled into a 0&#8211;100 score and</text>
<text x="188" y="336" text-anchor="middle" fill="#e8eef6" font-size="12.5">an <tspan fill="#5bbf93" font-weight="600">A&#8211;F grade</tspan> on the dashboard.</text>
<text x="188" y="372" text-anchor="middle" fill="#8595a8" font-size="11.5">score.js rolls up the findings</text>

<!-- card 2 : CI gate -->
<rect x="352" y="96" width="296" height="300" rx="13" fill="#0e1622" stroke="#1b2838"/>
<rect x="352" y="96" width="296" height="5" rx="2.5" fill="#22d3ee"/>
<text x="372" y="128" fill="#22d3ee" font-size="12.5" font-weight="700" letter-spacing="1.5">CLI &#183; CI GATE</text>
<rect x="372" y="144" width="256" height="64" rx="9" fill="#070b12" stroke="#1b2838"/>
<text x="386" y="170" fill="#5bbf93" font-size="11.5" font-family="Consolas, Menlo, monospace">npm run scan -- site.com</text>
<text x="386" y="192" fill="#5bbf93" font-size="11.5" font-family="Consolas, Menlo, monospace">  --min-grade B</text>
<text x="372" y="234" fill="#8595a8" font-size="11.5">Same scanner core, no web app.</text>
<text x="372" y="252" fill="#8595a8" font-size="11.5">Exits non-zero below threshold:</text>
<circle cx="380" cy="280" r="5" fill="#5bbf93"/>
<text x="396" y="285" fill="#e8eef6" font-size="12.5"><tspan fill="#5bbf93" font-weight="700">0</tspan>  pass</text>
<circle cx="380" cy="308" r="5" fill="#e0a85c"/>
<text x="396" y="313" fill="#e8eef6" font-size="12.5"><tspan fill="#e0a85c" font-weight="700">1</tspan>  below threshold</text>
<circle cx="380" cy="336" r="5" fill="#e8736b"/>
<text x="396" y="341" fill="#e8eef6" font-size="12.5"><tspan fill="#e8736b" font-weight="700">2</tspan>  scan / usage error</text>
<text x="372" y="376" fill="#8595a8" font-size="11.5">--min-score N &#183; --json &#183; --preset</text>

<!-- card 3 : MCP -->
<rect x="664" y="96" width="296" height="300" rx="13" fill="#0e1622" stroke="#1b2838"/>
<rect x="664" y="96" width="296" height="5" rx="2.5" fill="#22d3ee"/>
<text x="684" y="128" fill="#22d3ee" font-size="12.5" font-weight="700" letter-spacing="1.5">MCP &#183; scan TOOL</text>
<rect x="684" y="144" width="256" height="40" rx="9" fill="#070b12" stroke="#1b2838"/>
<text x="698" y="169" fill="#5bbf93" font-size="11.5" font-family="Consolas, Menlo, monospace">npm run mcp</text>
<text x="684" y="210" fill="#e8eef6" font-size="12.5">A zero-dependency stdio server</text>
<text x="684" y="228" fill="#e8eef6" font-size="12.5">exposing one tool:</text>
<rect x="684" y="240" width="256" height="36" rx="9" fill="#070b12" stroke="#1b2838"/>
<text x="698" y="263" fill="#22d3ee" font-size="11.5" font-family="Consolas, Menlo, monospace">scan { target, preset? }</text>
<text x="684" y="300" fill="#e8eef6" font-size="12.5">&#8594; a graded report with</text>
<text x="684" y="318" fill="#e8eef6" font-size="12.5">remediation hints.</text>
<text x="684" y="350" fill="#8595a8" font-size="11.5">Runs in-process &#8212; the web app</text>
<text x="684" y="368" fill="#8595a8" font-size="11.5">does not need to be running.</text>
</svg>
