<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="ac" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/></marker>
</defs>
<rect width="1000" height="730" rx="20" fill="#070b12"/>
<rect x="1" y="1" width="998" height="728" rx="19" fill="none" stroke="#1b2838"/>
<g transform="translate(40,40)">
<circle r="15" fill="none" stroke="#3a8fa3" stroke-width="1.4"/>
<circle r="8" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
<circle r="2.2" fill="#22d3ee"/>
<line x1="0" y1="0" x2="10.5" y2="-10.5" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
</g>
<text x="66" y="46" fill="#e8eef6" font-size="24" font-weight="700">vanta<tspan fill="#22d3ee">sec</tspan></text>
<text x="960" y="34" text-anchor="end" fill="#8595a8" font-size="12" letter-spacing="3" font-weight="600">HOW IT WORKS</text>
<text x="960" y="52" text-anchor="end" fill="#8595a8" font-size="11.5">input &#8594; safety gate &#8594; streamed live to the dashboard</text>
<line x1="40" y1="70" x2="960" y2="70" stroke="#1b2838"/>

<!-- stage 1 -->
<rect x="240" y="100" width="520" height="62" rx="14" fill="#0e1622" stroke="#1b2838"/>
<rect x="240" y="100" width="6" height="62" rx="3" fill="#22d3ee"/>
<circle cx="278" cy="131" r="15" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
<text x="278" y="136" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">1</text>
<text x="308" y="126" fill="#e8eef6" font-size="15.5" font-weight="700">target.js<tspan fill="#8595a8" font-size="12" font-weight="400">   normalize</tspan></text>
<text x="308" y="146" fill="#8595a8" font-size="12">turn a host / IP / URL into one clean, canonical target</text>
<line x1="500" y1="162" x2="500" y2="186" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ac)"/>

<!-- stage 2 : safety gate (highlighted) -->
<rect x="240" y="188" width="520" height="66" rx="14" fill="#0d1a24" stroke="#22d3ee" stroke-width="2"/>
<rect x="240" y="188" width="6" height="66" rx="3" fill="#e0a85c"/>
<circle cx="278" cy="221" r="15" fill="none" stroke="#e0a85c" stroke-width="1.8"/>
<text x="278" y="226" text-anchor="middle" fill="#e0a85c" font-size="14" font-weight="700">2</text>
<text x="308" y="216" fill="#e8eef6" font-size="15.5" font-weight="700">guard.js</text>
<rect x="392" y="205" width="92" height="17" rx="8.5" fill="#2a1d22" stroke="#e8736b"/>
<text x="438" y="217" text-anchor="middle" fill="#e8736b" font-size="10.5" letter-spacing="1.5" font-weight="700">SAFETY GATE</text>
<text x="308" y="238" fill="#8595a8" font-size="12">resolves first, then <tspan fill="#e8736b" font-weight="600">refuses</tspan> private / loopback / link-local / internal</text>
<text x="492" y="280" text-anchor="middle" fill="#8595a8" font-size="11">169.254.169.254 metadata &#183; 10/172/192.168 &#183; 127.0.0.1 &#183; CGNAT &#183; reserved &#8594; refused</text>
<line x1="500" y1="296" x2="500" y2="320" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ac)"/>

<!-- stage 3 -->
<rect x="240" y="322" width="520" height="62" rx="14" fill="#0e1622" stroke="#1b2838"/>
<rect x="240" y="322" width="6" height="62" rx="3" fill="#22d3ee"/>
<circle cx="278" cy="353" r="15" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
<text x="278" y="358" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">3</text>
<text x="308" y="348" fill="#e8eef6" font-size="15.5" font-weight="700">index.js<tspan fill="#8595a8" font-size="12" font-weight="400">   orchestrator</tspan></text>
<text x="308" y="368" fill="#8595a8" font-size="12">an async generator runs each check and <tspan fill="#5bbf93">yields progress events</tspan></text>
<line x1="500" y1="384" x2="500" y2="408" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ac)"/>

<!-- stage 4 -->
<rect x="240" y="410" width="520" height="62" rx="14" fill="#0e1622" stroke="#1b2838"/>
<rect x="240" y="410" width="6" height="62" rx="3" fill="#22d3ee"/>
<circle cx="278" cy="441" r="15" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
<text x="278" y="446" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">4</text>
<text x="308" y="436" fill="#e8eef6" font-size="15.5" font-weight="700">POST /api/scan<tspan fill="#8595a8" font-size="12" font-weight="400">   NDJSON stream</tspan></text>
<text x="308" y="456" fill="#8595a8" font-size="12">the generator becomes one JSON event per line over the wire</text>
<line x1="500" y1="472" x2="500" y2="496" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ac)"/>

<!-- stage 5 -->
<rect x="240" y="498" width="520" height="62" rx="14" fill="#0e1622" stroke="#5bbf93"/>
<rect x="240" y="498" width="6" height="62" rx="3" fill="#5bbf93"/>
<circle cx="278" cy="529" r="15" fill="none" stroke="#5bbf93" stroke-width="1.8"/>
<text x="278" y="534" text-anchor="middle" fill="#5bbf93" font-size="14" font-weight="700">5</text>
<text x="308" y="524" fill="#e8eef6" font-size="15.5" font-weight="700">live dashboard</text>
<text x="308" y="544" fill="#8595a8" font-size="12">progress renders as it arrives &#8212; <tspan fill="#5bbf93">no websockets</tspan></text>

<line x1="40" y1="592" x2="960" y2="592" stroke="#1b2838"/>
<text x="500" y="582" text-anchor="middle" fill="#22d3ee" font-size="12.5" letter-spacing="1.5" font-weight="700">ONE SCANNER CORE  &#8594;  THREE ENTRYPOINTS</text>

<!-- entrypoint cards -->
<rect x="40" y="608" width="290" height="86" rx="13" fill="#0e1622" stroke="#1b2838"/>
<text x="60" y="636" fill="#e8eef6" font-size="14.5" font-weight="700">Web app</text>
<text x="60" y="658" fill="#22d3ee" font-size="11.5" font-family="Consolas, Menlo, monospace">app/ &#183; useScan hook</text>
<text x="60" y="678" fill="#8595a8" font-size="11.5">the streaming dashboard at /</text>

<rect x="355" y="608" width="290" height="86" rx="13" fill="#0e1622" stroke="#1b2838"/>
<text x="375" y="636" fill="#e8eef6" font-size="14.5" font-weight="700">CLI</text>
<text x="375" y="658" fill="#22d3ee" font-size="11.5" font-family="Consolas, Menlo, monospace">bin/vantasec-scan.mjs</text>
<text x="375" y="678" fill="#8595a8" font-size="11.5">one-off scan + exit-code CI gate</text>

<rect x="670" y="608" width="290" height="86" rx="13" fill="#0e1622" stroke="#1b2838"/>
<text x="690" y="636" fill="#e8eef6" font-size="14.5" font-weight="700">MCP server</text>
<text x="690" y="658" fill="#22d3ee" font-size="11.5" font-family="Consolas, Menlo, monospace">bin/vantasec-mcp.mjs</text>
<text x="690" y="678" fill="#8595a8" font-size="11.5">in-process scan tool over stdio</text>
</svg>
